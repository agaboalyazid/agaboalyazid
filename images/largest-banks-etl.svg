<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Largest Banks ETL pipeline</title><desc id="desc">Extracts the largest-banks table from an archived Wikipedia page with requests and BeautifulSoup, converts market cap from USD to GBP, EUR and INR using exchange_rate.csv, loads to Largest_banks_data.csv and the SQLite database Banks.db, runs a SQL query, and logs each phase to code_log.txt.</desc><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58C5F8"/></marker></defs><rect x="0.5" y="0.5" width="999" height="469" rx="16" fill="#0D1117" stroke="#22324A" stroke-width="1" /><rect x="1" y="1" width="998" height="468" rx="16" fill="url(#g)"/><text x="36" y="52" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#58C5F8" text-anchor="start" letter-spacing="3">LARGEST BANKS ETL</text><text x="36" y="80" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#E6EDF3" text-anchor="start">Python ETL pipeline</text><rect x="36.0" y="112" width="168.0" height="196" rx="12" fill="#111A26" stroke="#22324A" stroke-width="1" /><text x="50.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">01</text><text x="50.0" y="166" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="start">Source</text><text x="50.0" y="202" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">Archived Wikipedia page</text><text x="50.0" y="226" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB0" text-anchor="start">List of largest banks</text><text x="50.0" y="250" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB0" text-anchor="start">(web.archive.org)</text><line x1="206.0" y1="210.0" x2="222.0" y2="210.0" stroke="#58C5F8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="226.0" y="112" width="168.0" height="196" rx="12" fill="#111A26" stroke="#58C5F8" stroke-width="1" /><text x="240.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">02</text><text x="240.0" y="166" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#58C5F8" text-anchor="start">Extract</text><text x="240.0" y="202" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">requests + BeautifulSoup</text><text x="240.0" y="226" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB0" text-anchor="start">Parse market-cap table</text><text x="240.0" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">→ Name, MC_USD_Billion</text><line x1="396.0" y1="210.0" x2="412.0" y2="210.0" stroke="#58C5F8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="416.0" y="112" width="168.0" height="196" rx="12" fill="#111A26" stroke="#58C5F8" stroke-width="1" /><text x="430.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">03</text><text x="430.0" y="166" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#58C5F8" text-anchor="start">Transform</text><text x="430.0" y="202" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">Clean values ($, B, commas)</text><text x="430.0" y="226" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB0" text-anchor="start">USD → GBP · EUR · INR</text><text x="430.0" y="250" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB0" text-anchor="start">Round to 2 decimals</text><line x1="586.0" y1="210.0" x2="602.0" y2="210.0" stroke="#58C5F8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="606.0" y="112" width="168.0" height="196" rx="12" fill="#111A26" stroke="#58C5F8" stroke-width="1" /><text x="620.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">04</text><text x="620.0" y="166" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#58C5F8" text-anchor="start">Load</text><text x="620.0" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#E6EDF3" text-anchor="start">Largest_banks_data.csv</text><text x="620.0" y="226" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB0" text-anchor="start">Banks.db (SQLite)</text><text x="620.0" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">table: Largest_banks</text><line x1="776.0" y1="210.0" x2="792.0" y2="210.0" stroke="#58C5F8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="796.0" y="112" width="168.0" height="196" rx="12" fill="#111A26" stroke="#22324A" stroke-width="1" /><text x="810.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">05</text><text x="810.0" y="166" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#58C5F8" text-anchor="start">Query</text><text x="810.0" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#E6EDF3" text-anchor="start">pandas.read_sql_query</text><text x="810.0" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">SELECT … WHERE</text><text x="810.0" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">Name = 'JPMorgan Chase'</text><line x1="500.0" y1="342" x2="500.0" y2="314" stroke="#58C5F8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arr)"/><rect x="416.0" y="342" width="168.0" height="30" rx="6" fill="#0F1722" stroke="#22324A" stroke-width="1" /><text x="500.0" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="middle">exchange_rate.csv</text><rect x="36" y="388" width="928" height="34" rx="8" fill="#0F1722" stroke="#22324A" stroke-width="1" /><text x="500.0" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#8B9BB0" text-anchor="middle">log_progress()  →  code_log.txt  ·  every phase logged with a timestamp</text><text x="36" y="448" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB0" text-anchor="start">Python · Requests · BeautifulSoup · Pandas · SQLite</text></svg>
