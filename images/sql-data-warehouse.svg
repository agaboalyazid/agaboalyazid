<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">SQL Data Warehouse medallion architecture</title><desc id="desc">Sources CRM and ERP CSV files load into 6 Bronze tables with BULK INSERT (bronze.load_bronze), are cleaned into 6 Silver tables (silver.load_silver, with quality checks), and exposed as Gold star-schema views: fact_sales, dim_customers, dim_products.</desc><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58C5F8"/></marker></defs><rect x="0.5" y="0.5" width="999" height="599" rx="16" fill="#0D1117" stroke="#22324A" stroke-width="1" /><rect x="1" y="1" width="998" height="598" rx="16" fill="url(#g)"/><text x="36" y="52" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#58C5F8" text-anchor="start" letter-spacing="3">SQL DATA WAREHOUSE</text><text x="36" y="80" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#E6EDF3" text-anchor="start">Medallion architecture on SQL Server</text><rect x="36" y="112" width="190" height="380" rx="12" fill="#111A26" stroke="#22324A" stroke-width="1" /><text x="52" y="142" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E6EDF3" text-anchor="start">Sources</text><text x="52" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB0" text-anchor="start">CSV files</text><line x1="52" y1="176" x2="210" y2="176" stroke="#22324A"/><text x="52" y="204" font-family="'Segoe UI'