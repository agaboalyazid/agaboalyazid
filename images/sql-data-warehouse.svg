'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">· bronze.load_bronze</text><rect x="518" y="112" width="220" height="380" rx="12" fill="#111A26" stroke="#22324A" stroke-width="1" /><text x="534" y="142" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#58C5F8" text-anchor="start">Silver</text><text x="534" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB0" text-anchor="start">Cleaned &amp; standardized</text><line x1="534" y1="176" x2="722" y2="176" stroke="#22324A"/><text x="534" y="204" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">6 tables</text><text x="534" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">silver.crm_cust_info</text><text x="534" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">silver.crm_prd_info</text><text x="534" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">silver.crm_sales_details</text><text x="534" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">silver.erp_cust_az12</text><text x="534" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">silver.erp_loc_a101</text><text x="534" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#8B9BB0" text-anchor="start">silver.erp_px_cat_g1v2</text><text x="534" y="364" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">· Trim, dedupe, standardize</text><text x="534" y="384" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">· Truncate &amp; insert</text><text x="534" y="404" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">· silver.load_silver</text><rect x="774" y="112" width="190" height="380" rx="12" fill="#111A26" stroke="#22324A" stroke-width="1" /><text x="790" y="142" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#58C5F8" text-anchor="start">Gold</text><text x="790" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB0" text-anchor="start">Business-ready</text><line x1="790" y1="176" x2="948" y2="176" stroke="#22324A"/><text x="790" y="204" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">Star schema (views)</text><rect x="790" y="220" width="158" height="32" rx="6" fill="#0F1722" stroke="#58C5F8" stroke-width="1" /><text x="802" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">gold.fact_sales</text><rect x="790" y="264" width="158" height="32" rx="6" fill="#0F1722" stroke="#22324A" stroke-width="1" /><text x="8